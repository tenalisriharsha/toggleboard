name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test API and client SDK
        run: mvn -B verify

  console:
    name: console (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: toggleboard-console/package-lock.json
      - name: Install dependencies
        working-directory: toggleboard-console
        run: npm ci
      - name: Unit tests (headless Chrome)
        working-directory: toggleboard-console
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Production build
        working-directory: toggleboard-console
        run: npx ng build

  infra:
    name: infra (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: fmt
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: init
        working-directory: terraform
        run: terraform init -input=false
      - name: validate
        working-directory: terraform
        run: terraform validate
      # No AWS credentials exist in CI: terraform test runs every file against a mocked provider.
      - name: test (mocked provider)
        working-directory: terraform
        run: terraform test
